[project]
name = "cjdev"
version = "0.1.0"
description = "Cangjie SDK developer utilities"
readme = "README.md"
authors = [{ name = "Dmitrii Chizha", email = "me@filaco.dev" }]
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["cangjie", "sdk", "cli", "developer-tools", "multi-repo", "build"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tomlkit>=0.15.1",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/FilaCo/cjdev"
Issues = "https://github.com/FilaCo/cjdev/issues"
Changelog = "https://github.com/FilaCo/cjdev/blob/master/CHANGELOG.md"

[project.scripts]
cjdev = "cjdev:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
    "ty==0.0.78",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]         # фикстуры
"src/cjdev/cli/*" = ["B008"] # Typer требует Option()/Argument() в дефолтах

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.10"
root = ["./src", "./tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "container: needs a container runtime daemon; skipped where none answers",
]

[tool.coverage.run]
source = ["cjdev"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
